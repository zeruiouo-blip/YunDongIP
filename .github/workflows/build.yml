name: build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w -X main.buildVersion=${GITHUB_REF_NAME} -X main.buildCommit=${GITHUB_SHA}' -o "dist/YunDongIP-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" ./cmd/yundongip
      - name: Attest build
        uses: actions/attest@v4
        with:
          subject-path: "dist/YunDongIP-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: YunDongIP-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/YunDongIP-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  source-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source variants
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/YunDongIP-0.1.0-pure-source.zip" cmd/yundongip/main.go cmd/yundongip/index.html go.mod
          git archive --format=zip --output="dist/YunDongIP-0.1.0-source-protected.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: YunDongIP-0.1.0-source-packages
          path: dist/YunDongIP-0.1.0-*.zip
