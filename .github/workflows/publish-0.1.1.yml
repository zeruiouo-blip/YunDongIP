name: publish-0.1.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify 0.1.1 baseline
        run: python tools/verify_baseline.py
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("cmd/yundongip/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          Path("/tmp/yundongip-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/yundongip-inline.js
      - name: Compile core
        run: go test ./...

  desktop:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Windows and Linux clients
        shell: bash
        run: |
          mkdir -p dist/win-x64 dist/win-arm64 dist

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o dist/win-x64/YunDongIP.exe ./cmd/yundongip
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o dist/win-arm64/YunDongIP.exe ./cmd/yundongip

          printf "YunDongIP 0.1.1 Windows x64\n\n解压后双击 YunDongIP.exe。\n本版本与其它平台使用同一份 0.1.1 核心源码。\n" > dist/win-x64/双击使用说明.txt
          printf "YunDongIP 0.1.1 Windows ARM64\n\n解压后双击 YunDongIP.exe。\n本版本与其它平台使用同一份 0.1.1 核心源码。\n" > dist/win-arm64/双击使用说明.txt

          (cd dist/win-x64 && zip -r ../YunDongIP-0.1.1-Windows-x64-Easy.zip .)
          (cd dist/win-arm64 && zip -r ../YunDongIP-0.1.1-Windows-ARM64-Easy.zip .)

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o dist/YunDongIP-0.1.1-Linux-x64-CLI ./cmd/yundongip
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o dist/YunDongIP-0.1.1-Linux-ARM64-CLI ./cmd/yundongip
      - name: Attest desktop builds
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/YunDongIP-0.1.1-Windows-x64-Easy.zip
            dist/YunDongIP-0.1.1-Windows-ARM64-Easy.zip
            dist/YunDongIP-0.1.1-Linux-x64-CLI
            dist/YunDongIP-0.1.1-Linux-ARM64-CLI
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-0.1.1
          path: |
            dist/YunDongIP-0.1.1-Windows-x64-Easy.zip
            dist/YunDongIP-0.1.1-Windows-ARM64-Easy.zip
            dist/YunDongIP-0.1.1-Linux-x64-CLI
            dist/YunDongIP-0.1.1-Linux-ARM64-CLI

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build macOS Universal app
        shell: bash
        run: |
          mkdir -p build/amd64 build/arm64 "dist/YunDongIP.app/Contents/MacOS" "dist/YunDongIP.app/Contents/Resources"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o build/amd64/YunDongIP ./cmd/yundongip
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o build/arm64/YunDongIP ./cmd/yundongip
          lipo -create -output "dist/YunDongIP.app/Contents/Resources/YunDongIP-core" build/amd64/YunDongIP build/arm64/YunDongIP
          cp clients/macos/launcher.sh "dist/YunDongIP.app/Contents/MacOS/YunDongIP"
          cp clients/macos/Info.plist "dist/YunDongIP.app/Contents/Info.plist"
          chmod +x "dist/YunDongIP.app/Contents/MacOS/YunDongIP" "dist/YunDongIP.app/Contents/Resources/YunDongIP-core"
          codesign --force --deep --sign - "dist/YunDongIP.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/YunDongIP.app" "dist/YunDongIP-0.1.1-macOS-universal.zip"
      - name: Attest macOS build
        uses: actions/attest@v4
        with:
          subject-path: dist/YunDongIP-0.1.1-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-0.1.1
          path: dist/YunDongIP-0.1.1-macOS-universal.zip

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone Android APK
        shell: bash
        run: |
          mkdir -p clients/android/app/src/main/jniLibs/arm64-v8a dist
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildmode=pie -trimpath -ldflags="-s -w -X main.buildVersion=0.1.1 -X main.buildCommit=${GITHUB_SHA}" -o clients/android/app/src/main/jniLibs/arm64-v8a/libyundongip.so ./cmd/yundongip
          cd clients/android
          gradle --no-daemon assembleDebug
          cd ../..
          cp clients/android/app/build/outputs/apk/debug/app-debug.apk dist/YunDongIP-0.1.1-android-arm64.apk
      - name: Attest Android build
        uses: actions/attest@v4
        with:
          subject-path: dist/YunDongIP-0.1.1-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-0.1.1
          path: dist/YunDongIP-0.1.1-android-arm64.apk

  protected-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package protected source
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/YunDongIP-0.1.1-protected-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: release-protected-source-0.1.1
          path: dist/YunDongIP-0.1.1-protected-source.zip

  publish:
    needs: [desktop, macos, android, protected-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-0.1.1
          path: dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum             YunDongIP-0.1.1-Windows-x64-Easy.zip             YunDongIP-0.1.1-Windows-ARM64-Easy.zip             YunDongIP-0.1.1-macOS-universal.zip             YunDongIP-0.1.1-android-arm64.apk             YunDongIP-0.1.1-Linux-x64-CLI             YunDongIP-0.1.1-Linux-ARM64-CLI             YunDongIP-0.1.1-protected-source.zip             > SHA256SUMS.txt
      - name: Create or update 0.1.1 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # YunDongIP 0.1.1

          0.1.1 是首轮公开测试反馈后的修复版本，所有客户端均由同一份最终源码与同一 Git commit 重新构建。

          ## 本次修复
          - Android / 手机浏览器完整功能页面改为响应式布局，并加入 YDip 启动图标。
          - 桌面页面按实际浏览器宽高自动适配，低分辨率可正常滚动并访问全部功能。
          - 数字身份证首跳改为自动识别当前公网出口地区与运营商；启动识别完成后会刷新旧缓存画像，不再固定显示杭州。
          - 扫描阶段每 240 个候选做一次小块预排序；扫描结束后分批合并排序结果；精测详细列表按 120 条分批显示，并对后续精测结果采用节流批量排序，降低大规模扫描结束与持续更新时的浏览器卡顿。
          - Windows / macOS / Android / Linux 全部同步 0.1.1 核心代码。

          ## 源码发布
          官方 Release 提供保护增强版源码，保留 GPL、版权、PROVENANCE、SECURITY、构建脚本及 GitHub Actions 构建来源信息。
          EOF

          if gh release view 0.1.1 --repo zeruiouo-blip/YunDongIP >/dev/null 2>&1; then
            gh api -X PATCH repos/zeruiouo-blip/YunDongIP/git/refs/tags/0.1.1 -f sha="${GITHUB_SHA}" -F force=true
            gh release edit 0.1.1 --title "YunDongIP 0.1.1" --notes-file /tmp/release-notes.md --repo zeruiouo-blip/YunDongIP
          else
            gh release create 0.1.1 --target "${GITHUB_SHA}" --title "YunDongIP 0.1.1" --notes-file /tmp/release-notes.md --repo zeruiouo-blip/YunDongIP
          fi

          gh release upload 0.1.1             dist/YunDongIP-0.1.1-Windows-x64-Easy.zip             dist/YunDongIP-0.1.1-Windows-ARM64-Easy.zip             dist/YunDongIP-0.1.1-macOS-universal.zip             dist/YunDongIP-0.1.1-android-arm64.apk             dist/YunDongIP-0.1.1-Linux-x64-CLI             dist/YunDongIP-0.1.1-Linux-ARM64-CLI             dist/YunDongIP-0.1.1-protected-source.zip             dist/SHA256SUMS.txt             --clobber             --repo zeruiouo-blip/YunDongIP
